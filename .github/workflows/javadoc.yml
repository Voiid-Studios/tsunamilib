name: Deploy Javadoc

on:
  push:
    branches:
      - '[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-hub-tsunamilib"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build TsunamiLib
        run: mvn -B clean install --file pom.xml -DskipTests

      - name: Generate Javadoc
        run: mvn -B javadoc:javadoc --file pom.xml

      - name: Debug target contents
        if: always()
        run: |
          echo "--- target tree ---"
          find target -maxdepth 6 2>/dev/null || echo "target/ does not exist at all"

      - name: Verify Javadoc output
        run: |
          if [ ! -d target/reports/apidocs ] || [ -z "$(ls -A target/reports/apidocs)" ]; then
            echo "target/reports/apidocs is missing or empty, check the Javadoc log above"
            exit 1
          fi

      - name: Generate pages-hub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PAGES_HUB_APP_ID }}
          private-key: ${{ secrets.PAGES_HUB_APP_PRIVATE_KEY }}
          owner: Voiid-Studios
          repositories: pages-hub

      - name: Checkout pages-hub
        uses: actions/checkout@v4
        with:
          repository: Voiid-Studios/pages-hub
          token: ${{ steps.app-token.outputs.token }}
          path: pages-hub

      - name: Copy javadoc into pages-hub
        run: |
          DEST="pages-hub/jd/tsunamilib/${GITHUB_REF_NAME}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r target/reports/apidocs/. "$DEST/"

      - name: Commit and push to pages-hub
        working-directory: pages-hub
        run: |
          git config user.name "pages-hub-writer[bot]"
          git config user.email "pages-hub-writer[bot]@users.noreply.github.com"
          git add "jd/tsunamilib/${GITHUB_REF_NAME}"
          if git diff --cached --quiet; then
            echo "There are no changes to the Javadoc; skipping commit..."
            exit 0
          fi
          git commit -m "docs(tsunamilib): update javadoc for ${GITHUB_REF_NAME}"
          git push